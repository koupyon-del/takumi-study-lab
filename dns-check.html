<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巧澄 Study Lab DNS診断</title><style>body{font:16px/1.6 system-ui,sans-serif;margin:0;background:#f5f5f4;color:#171717}main{max-width:660px;margin:auto;padding:22px 16px}h1{font-size:22px}.box{background:white;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 1px 8px #0001}button{background:#1d4ed8;color:white;font-size:17px;border:0;border-radius:12px;padding:14px 18px;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4f8;border-radius:10px;padding:12px;font-size:13px}.note{font-size:13px;color:#555}</style></head><body><main><h1>巧澄 Study Lab・DNS確認</h1><p>Supabaseの接続先が公開DNSに登録されているかを確認します。学習履歴、ログイン、クラウドデータには一切触れません。</p><div class="box"><button id="go">DNSを確認する</button><pre id="out">未実行</pre></div><p class="note">結果のスクリーンショットをChatGPTへ送ってください。Google Public DNSとCloudflare DNSに問い合わせます。</p></main><script>
const hostname="bisiipnuyvrlhusqwavl.supabase.co";const out=document.getElementById("out");
async function ask(name,url,headers){const controller=new AbortController();const t=setTimeout(()=>controller.abort(),9000);try{const r=await fetch(url,{headers:headers||{},cache:"no-store",signal:controller.signal});const raw=await r.text();if(!r.ok)return name+" : HTTP "+r.status;let d=JSON.parse(raw);let ips=(d.Answer||[]).filter(x=>x.type===1||x.type===28).map(x=>x.data);return name+" : DNS Status="+d.Status+" / IP="+(ips.length?ips.join(", "):"なし");}catch(e){return name+" : 確認できず（"+e.name+" / "+e.message+"）";}finally{clearTimeout(t)}}
document.getElementById("go").onclick=async()=>{out.textContent="確認中…";const q=encodeURIComponent(hostname);const a=await ask("Google DNS","https://dns.google/resolve?name="+q+"&type=A");out.textContent=a+"\nCloudflare照会中…";const b=await ask("Cloudflare DNS","https://cloudflare-dns.com/dns-query?name="+q+"&type=A",{"Accept":"application/dns-json"});out.textContent="接続先："+hostname+"\n"+a+"\n"+b+"\n\nStatus=0でIPが出れば公開DNSに登録されています。Status=3は存在しないドメインを示します。\n結果をスクリーンショットで送ってください。";};
</script></body></html>
