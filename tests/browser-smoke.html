<!doctype html><html lang="ja"><meta charset="utf-8"><title>Study Lab browser smoke test</title>
<body><p id="result">PENDING</p><iframe id="app" src="../index.html" width="350" height="650"></iframe>
<script>
const output=document.getElementById('result');
document.getElementById('app').addEventListener('load',()=>{
 try{
  const frame=document.getElementById('app'),w=frame.contentWindow,d=frame.contentDocument;
  const titleVersion=d.title.match(/v\d+(?:\.\d+)+/)?.[0];
  const badgeVersion=d.getElementById('studyLabVersionBadge')?.textContent.match(/v\d+(?:\.\d+)+/)?.[0];
  if(!titleVersion||titleVersion!==badgeVersion)throw Error('home version badge and page title disagree: '+badgeVersion+' / '+titleVersion);
  const api=w.TakumiVideoLessons;
  if(!api||api.lessonList.length!==81)throw Error('lesson list missing or incomplete');
  if(api.lessonList.filter(l=>l.overview).length!==11)throw Error('overview count wrong');
  const math=api.lessonList.find(l=>l.id==='ineq2-negative');
  const english=api.lessonList.find(l=>l.id==='en2-third-y');
  if(!math||!english)throw Error('masterclass lessons missing');
  api.openLibrary('home','math');
  // In every lesson, teach before asking: the lesson's first view must show an explanation.
  api.openLesson('overview-simultaneous','home');
  let s=d.getElementById('ts-video-screen');
  const lead=s.querySelector('.ts-teach-before-quiz');
  if(!lead||!lead.textContent.includes('赤いカード'))throw Error('simultaneous overview does not explain the story first');
  if(s.querySelector('.ts-decision-choices')?.offsetParent)throw Error('quiz shown before introduction');
  if(!s.textContent.includes('二つの分からない数'))throw Error('missing first overview teaching stage');
  const show=s.querySelector('#ts-reveal');
  if(!show||show.disabled)throw Error('lesson reveal wrongly blocked by quiz');
  show.click();
  for(let i=0;i<12;i++){
   const line=s.querySelector('#ts-next-line');
   if(!line||line.style.display==='none')break;
   line.click();
  }
  if(s.querySelector('#ts-vnext')?.disabled)throw Error('overview stage cannot advance after teacher explanation');
  api.openLesson('add','home');
  if(!s.querySelector('.ts-teach-before-quiz')?.textContent.includes('二つの文字'))throw Error('add lesson did not start with teacher explanation');
  api.openLesson('overview-inequality','home');
  if(!s.querySelector('.ts-teach-before-quiz'))throw Error('unrelated overview still asks before teaching');
  api.openLesson('en2-third-y','home');
  if(!s.querySelector('.ts-teach-before-quiz'))throw Error('English lessons still ask before teaching');
  
  if(!d.getElementById('ts-video-screen').textContent.includes('一次不等式'))throw Error('math catalogue not visible');
  api.openLesson('ineq2-negative','home');
  if(!d.getElementById('ts-video-screen').textContent.includes('不等式：負数で割る理由'))throw Error('math tutorial did not open');
  if(!d.getElementById('ts-reveal'))throw Error('missing explanation reveal');
  api.openLesson('ineq-negative','home');
  const mathLesson=d.getElementById('ts-video-screen');
  if(!mathLesson.textContent.includes('数直線の順番を確認'))throw Error('detailed negative-inequality lesson missing');
  const reveal=mathLesson.querySelector('#ts-reveal');if(!reveal)throw Error('math reveal missing');
  reveal.click();
  const showline=mathLesson.querySelector('#ts-next-line');
  for(let i=0;i<8&&showline?.style.display!=='none';i++)showline.click();
  if(!mathLesson.textContent.includes('よくある間違い')||!mathLesson.textContent.includes('自分で確かめること'))throw Error('detailed math coaching notes missing');
  api.openLesson('en2-third-y','home');
  if(!d.getElementById('ts-video-screen').textContent.includes('study→studies'))throw Error('English lesson did not open');
  output.textContent='PASS: 81 lessons, 11 overviews, math and English lecture screens';
 }catch(error){output.textContent='FAIL: '+String(error.message||error)}
});
setTimeout(()=>{if(output.textContent==='PENDING')output.textContent='FAIL: timeout loading application'},12000);
</script></body></html>
