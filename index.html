let state={cat:'history',set:[],i:0,score:0,locked:false,session:Date.now()};
let db=JSON.parse(localStorage.getItem('takumiLab03')||'{"played":0,"correct":0,"q":{},"sessions":0}');
function save(){localStorage.setItem('takumiLab03',JSON.stringify(db));updateStats()}
function rec(id){return db.q[id]||(db.q[id]={seen:0,correct:0,wrong:0,streak:0,last:0,sessions:[],levelWins:{}})}
function mastered(r){return r.correct>=2&&r.streak>=2&&new Set(r.sessions||[]).size>=2}
function updateStats(){played.textContent=db.played||0;rate.textContent=db.played?Math.round(db.correct/db.played*100)+'%':'—';mastered.textContent=Object.values(db.q||{}).filter(mastered).length}
function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function priority(q){let r=rec(q.id),now=Date.now(),days=r.last?(now-r.last)/86400000:99;let p=0;if(!r.seen)p+=55; p+=r.wrong*18; if(r.seen)p+=(1-r.correct/r.seen)*45; if(days>2)p+=Math.min(20,days*2); if(mastered(r))p-=35; let unit=unitStat(state.cat,q.u); if(unit.seen>=2&&unit.rate<.75)p+=18; let target=targetLevel(state.cat,q.u); if(q.l===target)p+=15; else if(q.l===target+1)p+=8; else if(q.l>target+1)p-=20; return p+Math.random()*12}
function pick(cat,n=10){state.cat=cat;let arr=[...data[cat]].sort((a,b)=>priority(b)-priority(a));let weak=arr.filter(q=>rec(q.id).wrong>0||unitStat(cat,q.u).rate<.75).slice(0,Math.ceil(n*.5));let ids=new Set(weak.map(x=>x.id));let rest=arr.filter(x=>!ids.has(x.id));let chosen=[...weak,...rest.slice(0,n-weak.length)];return shuffle(chosen)}
function start(cat){state.cat=cat;state.set=pick(cat,10);state.i=0;state.score=0;state.session=Date.now();db.sessions=(db.sessions||0)+1;save();show('quiz');render()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function goHome(){show('home');updateStats()}
function render(){state.locked=false;let q=state.set[state.i];meta.innerHTML=`<span class="badge">${label(state.cat)}</span><span class="badge">${q.u}</span><span class="badge">${L[q.l]}</span><span>${state.i+1} / ${state.set.length}</span>`;question.textContent=q.q;choices.innerHTML='';feedback.style.display='none';next.style.display='none';bar.style.width=(state.i/state.set.length*100)+'%';let mixed=shuffle(q.c.map((c,j)=>({text:c,correct:j===q.a})));state.currentChoices=mixed;state.correctIndex=mixed.findIndex(x=>x.correct);mixed.forEach((item,j)=>{let b=document.createElement('button');b.className='choice';b.textContent=item.text;b.onclick=()=>answer(j,b);choices.appendChild(b)})}
function answer(j,b){if(state.locked)return;state.locked=true;let q=state.set[state.i],r=rec(q.id),ok=j===state.correctIndex;db.played++;r.seen++;r.last=Date.now();r.sessions=r.sessions||[];if(!r.sessions.includes(state.session))r.sessions.push(state.session);if(ok){state.score++;db.correct++;r.correct++;r.streak++;r.levelWins[q.l]=(r.levelWins[q.l]||0)+1;b.classList.add('ok');feedback.innerHTML=`○ 正解。 ${q.e}<br><span class="small">${mastered(r)?'この問題は「定着」判定。':'まだ定着確認中。別セッションでも正解すると評価が上がります。'}</span>`}else{r.wrong++;r.streak=0;b.classList.add('ng');[...choices.children][state.correctIndex].classList.add('ok');feedback.innerHTML=`× 正解は「${state.currentChoices[state.correctIndex].text}」。 ${q.e}<br><span class="small">この問題と同分野は今後の出題優先度が上がります。</span>`}save();feedback.style.display='block';next.style.display='block'}
function nextQ(){state.i++;if(state.i>=state.set.length){bar.style.width='100%';resultTitle.textContent=`${state.score} / ${state.set.length} 正解`;let s=subjectStat(state.cat);resultText.textContent=`今回 ${state.score}/${state.set.length}。現在の定着 ${s.mastered}/${s.total}問、出題済み ${s.seen}/${s.total}問。次回は弱点・未定着・一段上の問題を優先します。`;show('result')}else render()}
function repeatQuiz(){start(state.cat)}function label(c){return({history:'社会',science:'理科',english:'英単語',waka:'百人一首'})[c]}
function unitStat(cat,u){let qs=data[cat].filter(x=>x.u===u),seen=0,correct=0,attempts=0,mas=0;qs.forEach(q=>{let r=rec(q.id);if(r.seen)seen++;correct+=r.correct;attempts+=r.seen;if(mastered(r))mas++});return{total:qs.length,seen,correct,attempts,mastered:mas,rate:attempts?correct/attempts:0}}
function subjectStat(cat){let qs=data[cat],seen=0,correct=0,attempts=0,mas=0,wrong=0;qs.forEach(q=>{let r=rec(q.id);if(r.seen)seen++;correct+=r.correct;attempts+=r.seen;wrong+=r.wrong;if(mastered(r))mas++});return{total:qs.length,seen,correct,attempts,mastered:mas,wrong,rate:attempts?correct/attempts:0}}
function targetLevel(cat,u){let qs=data[cat].filter(x=>x.u===u),best=1;for(let lv=1;lv<=6;lv++){let z=qs.filter(x=>x.l===lv);if(!z.length)continue;let seen=z.filter(x=>rec(x.id).seen>0);let att=seen.reduce((s,x)=>s+rec(x.id).seen,0),cor=seen.reduce((s,x)=>s+rec(x.id).correct,0);if(seen.length===z.length&&att&&cor/att>=.8)best=Math.min(6,lv+1);else if(lv===1&&seen.length)best=1}return best}
function openProgress(cat='history'){state.cat=cat;show('progressScreen');progressTabs.innerHTML='';Object.keys(data).forEach(c=>{let b=document.createElement('button');b.className='tab '+(c===cat?'on':'');b.textContent=label(c);b.onclick=()=>openProgress(c);progressTabs.appendChild(b)});let s=subjectStat(cat);progressSummary.innerHTML=`<div class="stats"><div class="stat"><b>${s.seen}/${s.total}</b><div class="small">出題済み</div></div><div class="stat"><b>${s.mastered}/${s.total}</b><div class="small">定着</div></div><div class="stat"><b>${s.attempts?Math.round(s.rate*100)+'%':'—'}</b><div class="small">累積正答率</div></div></div>`;let units=[...new Set(data[cat].map(x=>x.u))];unitRows.innerHTML='<div class="row head"><div>分野</div><div>定着</div><div>正答率</div><div>到達目安</div></div>'+units.map(u=>{let x=unitStat(cat,u),lv=Math.max(1,targetLevel(cat,u)-1),pct=x.total?Math.round(x.mastered/x.total*100):0;return `<div class="row"><div><b>${u}</b><div class="meter"><i style="width:${pct}%"></i></div></div><div>${x.mastered}/${x.total}</div><div>${x.attempts?Math.round(x.rate*100)+'%':'—'}</div><div>${x.seen?L[lv]:'未測定'}</div></div>`}).join('')}
function buildReport(){let lines=['【巧澄 Study Lab 学習レポート】',new Date().toLocaleString('ja-JP'),''];Object.keys(data).forEach(cat=>{let s=subjectStat(cat);lines.push(`■${label(cat)}：収録${s.total}問／出題済み${s.seen}問／定着${s.mastered}問／累積正答率${s.attempts?Math.round(s.rate*100)+'%':'未測定'}`);[...new Set(data[cat].map(x=>x.u))].forEach(u=>{let x=unitStat(cat,u),lv=Math.max(1,targetLevel(cat,u)-1);lines.push(`・${u}：定着${x.mastered}/${x.total}、正答率${x.attempts?Math.round(x.rate*100)+'%':'未測定'}、到達目安${x.seen?L[lv]:'未測定'}`)});lines.push('')});lines.push('【次回課題への希望】弱点・未定着を優先しつつ、安定分野は一段上の難易度を混ぜる。');return lines.join('\n')}
function openReport(){show('reportScreen');reportText.textContent=buildReport()}
async function copyReport(){let t=buildReport();try{await navigator.clipboard.writeText(t);alert('レポートをコピーしました。ChatGPTのチャットに貼り付けてください。')}catch(e){let r=document.createRange();r.selectNode(reportText);getSelection().removeAllRanges();getSelection().addRange(r);alert('自動コピーできない場合は、選択されたレポートをコピーしてください。')}}
function resetStats(){if(confirm('この端末の学習記録をすべて消しますか？')){db={played:0,correct:0,q:{},sessions:0};save();alert('学習記録をリセットしました。')}}
updateStats();
</script></body></html>
