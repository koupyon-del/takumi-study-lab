<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Lab 接続診断</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:650px;padding:20px;margin:auto;background:#fafafa}button{font:inherit;padding:12px;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:14px;border-radius:12px}</style><h2>巧澄 Study Lab・通信診断</h2><p>通信を確認するだけです。ログイン・記録の変更は行いません。</p><button id="go">接続テスト開始</button><pre id="out">まだ開始していません</pre><script>
const host="https://bisiipnuyvrlhusqwavl.supabase.co";
async function check(label,url,mode){let c=new AbortController(),t=setTimeout(()=>c.abort(),10000);let start=Date.now();try{let r=await fetch(url,{mode,signal:c.signal,cache:"no-store"});return label+"：到達（HTTP "+r.status+"、type="+r.type+"、"+(Date.now()-start)+"ms）";}catch(e){return label+"：失敗（"+e.name+"／"+e.message+"）";}finally{clearTimeout(t);}}
document.querySelector("#go").onclick=async()=>{let out=document.querySelector("#out");out.textContent="確認中…";let lines=[];for(let [n,u,m] of [["GitHubページ","./index.html","cors"],["Supabase no-cors",host+"/","no-cors"],["Supabase 通常通信",host+"/","cors"],["認証設定（キーなし）",host+"/auth/v1/settings","cors"]]){lines.push(await check(n,u,m));out.textContent=lines.join("\n");}out.textContent+="\n結果をスクリーンショットで送ってください。";};
</script></html>
